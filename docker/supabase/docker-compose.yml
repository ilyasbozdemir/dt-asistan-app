# ==============================================================================
# HAKİM Pro - Kurum İçi / Self-Hosted Supabase Docker Compose Stack
# ==============================================================================
# Kurulum için:
#   1. cp .env.example .env
#   2. .env içerisindeki POSTGRES_PASSWORD, JWT_SECRET, ANON_KEY ve SERVICE_ROLE_KEY'i belirleyin.
#   3. docker compose up -d
#   4. Tarayıcıdan http://SUNUCU_IP:8000 adresinden Studio'ya girip SQL Editor'e packages/database/src/supabase/schema.sql içeriğini yapıştırın.
# ==============================================================================

services:
  # 1. Supabase Studio (Yönetim Paneli)
  studio:
    image: supabase/studio:20240101-8e0e640
    container_name: hakim-supabase-studio
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: "HAKİM Pro Kamu Kurumu"
      DEFAULT_PROJECT_NAME: "HAKIM Pro DB"
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

  # 2. Kong API Gateway (Tüm REST, Auth, Storage İsteklerini Yönlendirir)
  kong:
    image: kong:2.8.1
    container_name: hakim-supabase-kong
    restart: unless-stopped
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"
      - "${KONG_HTTPS_PORT:-8443}:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./volumes/api:/var/lib/kong:ro

  # 3. GoTrue (Kimlik Doğrulama / Auth)
  auth:
    image: supabase/gotrue:v2.132.3
    container_name: hakim-supabase-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  # 4. PostgREST (Otomatik RESTful API Motoru)
  rest:
    image: postgrest/postgrest:v12.0.1
    container_name: hakim-supabase-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: "public,storage"
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # 5. Storage (Belge & Evrak Depolama Servisi)
  storage:
    image: supabase/storage-api:v0.43.11
    container_name: hakim-supabase-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: 524288000 # 500MB
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - ./volumes/storage:/var/lib/storage:z

  # 6. Meta (Postgres Metadata Servisi)
  meta:
    image: supabase/postgres-meta:v0.75.0
    container_name: hakim-supabase-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # 7. PostgreSQL 15 (Ana Veritabanı)
  db:
    image: supabase/postgres:15.1.0.117
    container_name: hakim-supabase-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data:z
      - ./volumes/db/init:/docker-entrypoint-initdb.d:z
